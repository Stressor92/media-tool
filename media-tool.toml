[api]
opensubtitles_api_key = "cAeMfM14epFYPgCgDcQg3TG6wTnm8vcs"   # <-- hier deinen Key eintragen
acoustid_api_key      = "cur84dh2Vo"   # <-- hier deinen Key eintragen
tmdb_api_key          = "2e528f2f856be09f53570dac14f1921d"             # <-- TMDB v3 API Key
opensubtitles_user_agent = "media-tool v1.0"
googlebooks_api_key = ""

# ---------------------------------------------------------------------------
# Externe Tools (müssen im PATH sein oder absolut angeben)
# ---------------------------------------------------------------------------
[tools]
ffmpeg  = "ffmpeg"
ffprobe = "ffprobe"
yt_dlp  = "yt-dlp"
mp3gain = "C:/Program Files (x86)/MP3Gain/mp3gain.exe"

# ---------------------------------------------------------------------------
# Pfade
# ---------------------------------------------------------------------------
[paths]
library_root   = "D:\\Musik\\Interpreten"
incoming_root  = "C:\\Users\\hille\\Downloads"
temp_dir       = "C:\\Users\\hille\\AppData\\Local\\Temp\\media-tool"

# ---------------------------------------------------------------------------
# Standard-Einstellungen Untertitel
# ---------------------------------------------------------------------------
[defaults.subtitles]
languages = ["de", "en"]
embed     = true
auto      = true

# ---------------------------------------------------------------------------
# Standard-Einstellungen Audio / AcoustID
# ---------------------------------------------------------------------------
[defaults.audio]
min_confidence = 0.75

# ---------------------------------------------------------------------------
# Automatische Audio-Spracherkennung (A04 Audit-Fix)
# ---------------------------------------------------------------------------
[language_detection]
min_confidence  = 0.85
whisper_model   = "medium"
device          = "auto"
sample_duration = 30
sample_offset   = 120
create_backup   = false
hint_languages  = ["de", "en"]

# ---------------------------------------------------------------------------
# Download (yt-dlp)
# Hinweis: der Downloader nutzt intern das Python-Paket `yt_dlp`.
# Der Tool-Eintrag oben ist trotzdem sinnvoll für Shell-Nutzung und Alt-Skripte.
# ---------------------------------------------------------------------------
[download]
default_output_video  = "C:\\Users\\hille\\Downloads\\Videos"
default_output_music  = "C:\\Users\\hille\\Downloads\\Musik"
default_output_series = "C:\\Users\\hille\\Downloads\\Serien"
max_resolution        = 1080
audio_format          = "mp3"
audio_quality         = "320k"
preferred_language    = "de"
subtitle_languages    = ["de", "en"]
embed_subtitles       = true
embed_thumbnail       = true
sponsorblock_remove   = ["sponsor"]

# ---------------------------------------------------------------------------
# Upscale-Profile (Hinweis, keine aktiven Einstellungen)
#
# Verfügbare Profile (--profile):
#   dvd       720p · CRF 21 · preset medium   (Standard, aus PS-Skript)
#   dvd-hq    720p · CRF 18 · preset slow     (wichtige Filme)
#   dvd-fast  720p · CRF 23 · preset fast     (schneller NAS-Batch)
#   1080p     1080p· CRF 20 · preset medium   (Full HD)
#   anime     720p · CRF 19 · preset slow     (Anime, kein Cropdetect)
#   archive   720p · CRF 14 · preset veryslow (Archiv-Qualität)
#
# Alle Profile anzeigen: media-tool upscale profiles
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Film-Metadaten + Artwork (TMDB)
# ---------------------------------------------------------------------------
[metadata]
language = "de-DE"
fallback_language = "en-US"
preferred_artwork_lang = "de"
auto_select = true
overwrite_nfo = false
overwrite_artwork = false

[metadata.artwork]
download_poster = true
download_fanart = true
download_banner = false
download_thumb = false
download_logo = false

[metadata.cast]
max_actors = 20

# ---------------------------------------------------------------------------
# Hardware encoder defaults for the upscale commands
# ---------------------------------------------------------------------------
[upscale]
encoder = "auto"
hw_fallback_on_error = true
nvenc_max_vram_mb = 0
nvenc_max_sessions = 2
hw_probe_timeout_sec = 10

# ---------------------------------------------------------------------------
# Ebook workflows
# ---------------------------------------------------------------------------
[ebook]
preferred_format = "epub"
download_cover = true
metadata_providers = ["openlibrary", "googlebooks"]

[ebook.organization]
structure = "{author}/{series}/{title}"

[ebook.conversion]
target_format = "epub"

# ---------------------------------------------------------------------------
# Jellyfin integration (optional)
# ---------------------------------------------------------------------------
[jellyfin]
base_url = ""
api_key = ""
wait_for_scan = false
scan_timeout = 300

# ---------------------------------------------------------------------------
# Statistics + backup / rollback defaults
# ---------------------------------------------------------------------------
[statistics]
data_dir = ""
history_max_days = 365
enabled = true

[backup]
enabled = true
backup_dir = ""
max_size_gb = 50
max_age_days = 30

[backup.auto_cleanup]
after_days = 0
video = true
audio = true
ebook = true
audiobook = true

[backup.validation]
video_duration_tolerance = 0.05
audio_duration_tolerance = 0.03
audiobook_duration_tolerance = 0.05
require_audio_tracks = true
require_subtitles_if_present = true
require_tags = true
min_audio_bitrate_kbps = 0
require_epub_metadata = true
require_cover = true
require_isbn_if_present = false
require_chapters = true
