# Copy this file to media-tool.toml and fill in your local values.
# The real media-tool.toml file is ignored by Git.
# This template mirrors the currently implemented typed config model in `src/utils/config.py`.

[api]
opensubtitles_api_key = ""
acoustid_api_key = ""
tmdb_api_key = ""
googlebooks_api_key = ""
opensubtitles_user_agent = "media-tool v1.0"

[tools]
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
yt_dlp = "yt-dlp"
mp3gain = "mp3gain"

[paths]
library_root = ""
incoming_root = ""
temp_dir = ""

[defaults.subtitles]
languages = ["de", "en"]
embed = true
auto = true

[defaults.audio]
min_confidence = 0.7

[download]
default_output_video = "downloads/videos"
default_output_music = "downloads/music"
default_output_series = "downloads/series"
max_resolution = 1080
audio_format = "mp3"
audio_quality = "320k"
preferred_language = "de"
subtitle_languages = ["de", "en"]
embed_subtitles = true
embed_thumbnail = true
sponsorblock_remove = ["sponsor"]

# Hardware encoder selection for the upscale commands.
[upscale]
encoder = "auto"            # auto | nvenc | amf | qsv | software
hw_fallback_on_error = true
nvenc_max_vram_mb = 0
nvenc_max_sessions = 2
hw_probe_timeout_sec = 10

# Audio-language tagging for unlabeled tracks.
[language_detection]
min_confidence = 0.85
whisper_model = "medium"
device = "auto"
sample_duration = 30
sample_offset = 120
create_backup = false
hint_languages = ["de", "en"]

# TMDB-backed movie metadata defaults.
[metadata]
language = "de-DE"
fallback_language = "en-US"
preferred_artwork_lang = "de"
auto_select = true
overwrite_nfo = false
overwrite_artwork = false

[metadata.artwork]
download_poster = true
download_fanart = true
download_banner = false
download_thumb = false
download_logo = false

[metadata.cast]
max_actors = 20

# E-book defaults for identify/enrich/organize/convert commands.
[ebook]
preferred_format = "epub"
download_cover = true
metadata_providers = ["openlibrary", "googlebooks"]

[ebook.organization]
structure = "{author}/{series}/{title}"

[ebook.conversion]
target_format = "epub"

# Jellyfin is optional; fill these only if you use the jellyfin commands.
[jellyfin]
base_url = "http://localhost:8096"
api_key = ""
wait_for_scan = false
scan_timeout = 300

# Statistics and backup/rollback are enabled by default.
[statistics]
data_dir = ""
history_max_days = 365
enabled = true

[backup]
enabled = true
backup_dir = ""
max_size_gb = 50
max_age_days = 30

[backup.auto_cleanup]
after_days = 0
video = true
audio = true
ebook = true
audiobook = true

[backup.validation]
video_duration_tolerance = 0.05
audio_duration_tolerance = 0.03
audiobook_duration_tolerance = 0.05
require_audio_tracks = true
require_subtitles_if_present = true
require_tags = true
min_audio_bitrate_kbps = 0
require_epub_metadata = true
require_cover = true
require_isbn_if_present = false
require_chapters = true

# Note:
# Subtitle translation is currently configured mainly through CLI options plus optional
# extras from `pyproject.toml`; there is no stable top-level [translation] section in
# the typed config model yet.